name: Generate Metrics

on:
  schedule: [{cron: "0 0 * * 0"}]
  workflow_dispatch:
  push:
    branches: ["master", "main"]
    paths:
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Default metrics
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          committer_branch: metrics-outputs
          
          config_display: large

      - name: Most and recently used languages
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          committer_branch: metrics-outputs

          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_recent_days: 7
          plugin_languages_recent_load: 300
          plugin_languages_ignored: html, css, dockerfile, makefile
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_limit: 8
          
          repositories_forks: no
          repositories_affiliations: owner, collaborator
